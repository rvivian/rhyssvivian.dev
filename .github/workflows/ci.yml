# Required check for every pull request into main (see the "Protect main" ruleset).
# Auto-merge waits on this job, so it must cover everything a human reviewer would run.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Production dependencies only; fails on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high
